[package]
name = "delta-struct"
version = "0.1.0"
authors = ["Jacob Kiesel <jake@bitcrafters.co>"]
edition = "2018"
repository = "https://github.com/Xaeroxe/delta-struct-rs"
license = "MIT OR Apache-2.0"
description = "Delta struct provides a rust-lang Deriveable trait, Delta, that can be used to compute the difference (aka delta) between two instances of a type."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
serde = ["dep:serde"]

[dependencies]
delta-struct-macros = { version = "0.1.0", path = "../delta-struct-macros"  }
similar = { version = "3.1", default-features = false, features = ["std"] }
serde = { version = "1.0", optional = true, features = ["derive"] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
